name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PASADHI-windows-x64.zip
            sep: ';'
          - os: ubuntu-latest
            artifact: PASADHI-linux-x64.tar.gz
            sep: ':'
          - os: macos-latest
            artifact: PASADHI-macos.tar.gz
            sep: ':'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller psutil
      - name: Build one-file binary
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --onefile --name pasadhi \
            --collect-submodules pasadhi.app \
            launcher.py
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          cp dist/pasadhi* out/
          cp README.md LICENSE NOTICE out/
          cd out && ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*

  android:
    name: android (briefcase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          python -m pip install briefcase
          briefcase create android --no-input || true
          briefcase build android --no-input || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PASADHI-android
          path: android/**/*.apk
          if-no-files-found: warn

  release:
    needs: [desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            PASADHI ${{ github.ref_name }}

            - Windows, Linux and macOS: one-file binary built with PyInstaller
            - Android: built with Briefcase (foreground service + boot receiver)
            - Source: `PASADHI-0.1.0-source.zip` from the previous release, or this tag
